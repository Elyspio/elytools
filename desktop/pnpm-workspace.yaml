allowBuilds:
    "@parcel/watcher": true
    electron: true
    electron-winstaller: false
    esbuild: true
    ssh2: false

ignoredOptionalDependencies:
    - cpu-features

catalog:
    vite: npm:@voidzero-dev/vite-plus-core@1.5.1
    vite-plus: 1.5.1

overrides:
    vite: "catalog:"

peerDependencyRules:
    allowAny:
        - vite
    allowedVersions:
        vite: "*"

minimumReleaseAgeExclude:
    - "@elyspio/vite-eslint-config@8.0.0-rc.0"
