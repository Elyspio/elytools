name: Desktop

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: desktop-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Check and test
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: desktop
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  package_json_file: desktop/package.json

            - uses: actions/setup-node@v4
              with:
                  node-version: 26
                  cache: pnpm
                  cache-dependency-path: desktop/pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Without --fix: a formatting or lint issue fails the job instead of being rewritten
            - name: Format, lint and types
              run: pnpm exec vp check

            - name: Tests
              run: pnpm test
